name: sukarah
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=2.19.2 <3.0.0'

dependencies:
  appwrite: ^16.1.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.4.0
  flutter_svg: ^1.0.1 
  image_picker: ^1.1.2
  lottie: ^2.3.2
  path: ^1.9.1
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/Music/
    - assets/Lottie/

  fonts:
  - family: Cairo 
    fonts:
      - asset: assets/fonts/Cairo-Regular.ttf
